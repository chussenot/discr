# Bernstein configuration for discr.
#
# The coordination loop lives in scripts/loop.sh (`mise run loop`); this file
# is what bernstein itself reads when it is invoked without a plan. The plan
# it normally runs is plans/discr-loop.yaml.
#
# There is deliberately no `goal:` here. In this repository the goal is always
# a bead -- `bd ready` is the backlog, and the loop passes the selected bead's
# title through. A goal pinned in this file would compete with the tracker for
# authority over what the fleet is doing, and the tracker wins.
#
# But bernstein 4.0.0 REQUIRES one: in plan-file mode `bernstein run` hands the
# spawned orchestrator no seed path, so that process re-reads this file and dies
# with "Seed file must contain a non-empty 'goal' string" (the watchdog then
# records `invalid-seed-configuration` and does not restart it). So scripts/
# loop.sh writes a per-run copy of this file plus `goal: <bead>: <title>` and
# points every bernstein subprocess at it via BERNSTEIN_SEED_PATH. Running
# `bernstein run` by hand in this directory fails for exactly that reason --
# use `mise run loop`.

# No third-party LLM provider. bernstein defaults this to `openrouter_free` and
# warns that evolution/auto_decompose stay disabled until an OpenRouter key is
# exported. This project does not use one and must not invent one; say so.
internal_llm_provider: none

# Pinned, not `auto`. This container has exactly one adapter (claude); the
# other two bernstein knows about are absent by design, and `bernstein doctor`
# probes all three unconditionally -- see docs/coordination-loop.md. Pinning
# also stops a future run from silently dispatching to an adapter that has
# never been held to this repository's house rules.
cli: claude
team: auto
budget: "$10"      # per run; scripts/loop.sh overrides with --budget

# DELIBERATELY ABSENT: `approval: pr` and `worktrees: true`. This file used to
# carry both, and the first real `bernstein run` on 4.0.0 printed
#
#   Ignoring unknown top-level key 'approval' in seed file; did you mean 'approvals'?
#   Ignoring unknown top-level key 'worktrees' in seed file; did you mean 'worktree_setup'?
#
# i.e. they were never applied, and the comments that used to sit here claiming
# "gate before merge with a pull request" described a protection that did not
# exist. The suggested spellings are NOT the same settings: `approvals:` is a
# queue for gating individual tool calls by trust class (core/approval/gate.py),
# and `worktree_setup:` configures how a worktree is prepared. The pr/review/
# auto merge-gate mode exists only as the top-level `bernstein -g --approval`
# flag, which `bernstein run` does not take.
#
# Do not re-add them without a live run showing the warning gone AND a
# behaviour that differs. What actually protects master is outside bernstein:
# scripts/loop.sh commits only the leased paths, only after the gates pass,
# onto a feature branch, and a human merges the PR.
