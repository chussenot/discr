[package]
# A bare `cargo run` should be unambiguous rather than depending on this crate
# having exactly one binary.
default-run = "tracecheck"
name = "disc-tools"
description = "Trace tooling for disc-core: tracecheck replays an ST trace and reports the first divergence."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tracecheck"
path = "src/main.rs"

[dependencies]
disc-core = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
