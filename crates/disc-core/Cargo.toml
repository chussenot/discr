[package]
name = "disc-core"
description = "Deterministic integer-only re-implementation of the Disc (Loriciel, 1990) game rules."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Serialization of the public state types, for the tracecheck tool only.
# disc-core has no non-optional dependencies.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

# Test-only: `ai.rs`'s agreement measurement reads the committed fixtures
# directly (minimal field-scoped structs, not disc-tools's `Frame`) so the
# measurement does not depend on a file `discr-b6x` does not own.
[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
