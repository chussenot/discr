[tools]
rust = "latest"

# ---------------------------------------------------------------------------
# Tasks.  These replace the former root Makefile.
#
# oracle/Makefile is deliberately NOT converted: it is a real C build whose
# sources are generated (m68kmake emits m68kops.c/h from m68k_in.c), so it
# wants make's dependency tracking.  `mise run oracle` shells out to it, which
# keeps incremental rebuilds working.
# ---------------------------------------------------------------------------

[env]
# THE WHOLE FIXTURE.  With only docs/state-schema.md's waived rows resynced,
# disc-core reproduces all 99 ticks of tests/fixtures/golden.ndjson with no
# divergence at all -- player 1's walk, its two turn transients, both strikes,
# the energy going 5 -> 2 -> 0, the death sequence, and the disc's whole flight
# including two serves and a floor bounce.
#
# The gate is still on the LENGTH of the matching prefix rather than on the run
# being clean, because that is what catches a regression: this number can only
# go down.  reports/part10-report.md carries the reasoning, and
# scripts/oracle_diff.py uses the same --min-agree idiom for the oracle's
# 275-frame boundary.
#
# 10 before Part 10, 51 after the state machine, 63 after the serve, 99 after
# the hit test.
TRACE_MIN_AGREE = "99"
GOLDEN = "tests/fixtures/golden.ndjson"

# THE WHOLE IDLE FIXTURE, all 214 ticks, no divergence: four tile events, a
# destruction and its 49-tick collapse, three serves across three different
# throw states, and both discs' whole flight.
# 10 before Part 10, 51, 118, 189, 207, 214.
TILE_DAMAGE = "tests/fixtures/tile_damage.ndjson"

# The third gate, and the strictest thing this repo measures: NOTHING waived and
# NOTHING resynced, every compared row of BOTH players.  39 ticks, stopping where
# state 18's handler steps player 2 six units left into a throw ($c1d0), which
# needs the two disc counters $6d8a/$6d8c that disc-core does not model.
# Before Part 10c this run stopped on frame 1, because player 2 was driven with
# no input at all; before 10f it stopped on frame 22.
FULL_MIN_AGREE = "39"
TILE_MIN_AGREE = "214"

# The repository's first three commits predate conventional commits (`bd init`
# is not one of them), so cog is pointed at the range after them rather than
# being told to ignore a rule. Everything since is compliant.
CONVENTIONAL_SINCE = "ec61cbb"

[tasks.oracle]
description = "Build disc-oracle (vendored Musashi; see oracle/README.md)"
run = "make -C oracle"
sources = ["oracle/disc-oracle.c", "oracle/musashi/**/*.c", "oracle/musashi/**/*.h"]
outputs = ["oracle/disc-oracle"]

[tasks.oracle-check]
description = "Differential validation of disc-oracle against Hatari, plus determinism"
depends = ["oracle"]
run = "./scripts/oracle_check.sh"

[tasks.core-check]
description = "The phase gate: fmt + clippy + tests + tracecheck on the golden fixture"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --skip-waived --min-agree $TRACE_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE --skip-waived --min-agree $TILE_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --min-agree $FULL_MIN_AGREE",
]

[tasks.tracecheck]
description = "The ungated view: both fixtures without --min-agree, so a divergence exits 1"
run = [
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --skip-waived",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE --skip-waived",
]

[tasks.tracecheck-deep]
description = "Both fixtures with nothing waived: the strictest measurement, not a gate"
run = [
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE",
]

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt"

[tasks.clean]
description = "Clean the oracle build and the Rust target directory"
run = ["make -C oracle clean", "cargo clean"]

[tasks.check-commits]
description = "Lint commit messages with cocogitto, from the first conventional commit"
run = "cog check $CONVENTIONAL_SINCE..HEAD"

[tasks.changelog]
description = "Preview the changelog cog would generate (does not write)"
run = "cog changelog $CONVENTIONAL_SINCE..HEAD"
