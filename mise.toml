[tools]
rust = "latest"

# ---------------------------------------------------------------------------
# Tasks.  These replace the former root Makefile.
#
# oracle/Makefile is deliberately NOT converted: it is a real C build whose
# sources are generated (m68kmake emits m68kops.c/h from m68k_in.c), so it
# wants make's dependency tracking.  `mise run oracle` shells out to it, which
# keeps incremental rebuilds working.
# ---------------------------------------------------------------------------

[env]
# THE WHOLE FIXTURE.  With only docs/state-schema.md's waived rows resynced,
# disc-core reproduces all 99 ticks of tests/fixtures/golden.ndjson with no
# divergence at all -- player 1's walk, its two turn transients, both strikes,
# the energy going 5 -> 2 -> 0, the death sequence, and the disc's whole flight
# including two serves and a floor bounce.
#
# The gate is still on the LENGTH of the matching prefix rather than on the run
# being clean, because that is what catches a regression: this number can only
# go down.  reports/part10-report.md carries the reasoning, and
# scripts/oracle_diff.py uses the same --min-agree idiom for the oracle's
# 275-frame boundary.
#
# 10 before Part 10, 51 after the state machine, 63 after the serve, 99 after
# the hit test.
TRACE_MIN_AGREE = "99"
GOLDEN = "tests/fixtures/golden.ndjson"

# THE WHOLE IDLE FIXTURE, all 214 ticks, no divergence: four tile events, a
# destruction and its 49-tick collapse, three serves across three different
# throw states, and both discs' whole flight.
# 10 before Part 10, 51, 118, 189, 207, 214.
TILE_DAMAGE = "tests/fixtures/tile_damage.ndjson"

# The third fixture, minted in Part 11 (tests/fixtures/p1_walk.provenance.md).
# Player 1 walks left for 25 frames and then stands still, which is enough to
# reach code the other two never do -- including a FOURTH steering hook, $a78e,
# whose SteerHook variant did not exist until this fixture found it.
#
# It is the only one of the three that is not clean, which is why it is worth
# having: a clean gate measures nothing new. 191 ticks -- 123 before player 2's
# strike, 142 before the collapse moved to the end of the tick, 143 before the
# walk probe stopped gating the step (it never did on the ST; see walk_probe).
#
# 237 ticks. The frame-192 wall turned out to be disc-core's own shape twice over:
# the game update lives in the MAIN LOOP, not the VBL, so a sampled frame holds
# 0, 1 or 2 passes (Part 11f) -- and each pass consumes its OWN joystick bytes,
# because $d2cc rewrites $6da1 inside the repeat loop (Part 11g). Both clean
# fixtures run exactly one pass per frame, which is why one-tick-one-update
# survived eleven parts.
#
# This fixture is still not independently validated against Hatari for its own
# input programme -- see its provenance -- so raising this number is measuring
# disc-core against the oracle, not against the machine.
#
# Still 223: the frame-224 wall is attributed (bd discr-hif), not movable from
# committed evidence. Every $6d22 writer is transcribed; what diverges is the
# INPUT -- $10ec6/$10ece write and consume the AI byte once per main-loop pass,
# ai_6da1 is sampled once per VBL, and 223 -> 224 is the one 2-pass tick whose
# passes consumed different bytes ($08 walks +3 at $b24e, then $00 exits to the
# turn). Reproducing the mid-frame byte needs the undecoded AI policy or a
# fixture with a per-pass input column. See p1_walk.provenance.md.
P1_WALK = "tests/fixtures/p1_walk.ndjson"
P1_WALK_MIN_AGREE = "274"

# The third gate, and the strictest thing this repo measures: NOTHING waived and
# NOTHING resynced, every compared row of BOTH players -- and on golden it now
# reproduces THE WHOLE FIXTURE.  Resyncing buys nothing there any more.
# Before Part 10c this run stopped on frame 1, because player 2 was driven with
# no input at all; 22 before 10f, 40 before state 18's handler, 58 before the
# animation tables, 59 before player 2's idle-path throw decision.
FULL_MIN_AGREE = "99"

# The fourth gate: the idle fixture with nothing waived either -- CLEAN as of
# Part 10k, all 214 ticks.  59 before Part 10j, 161 before the running smash.
#
# All four runs are clean now.  The gates stay on --min-agree rather than on zero
# divergence anyway, because that is what catches a regression: a clean run can
# only get shorter, and the number tells you by how much.
TILE_FULL_MIN_AGREE = "214"
TILE_MIN_AGREE = "214"

# The fourth fixture (Part 12, discr-ovl.2): tests/fixtures/handover.provenance.md.
# Minted specifically to catch the disc's owner byte (disc+$11) actually
# changing hands -- twice, in both directions, on the same disc slot -- and to
# show the four possession counters ($6d8a/$6d8c/$6d0a/$6d0c, ported as
# players[n].discs_out/disc_cap) moving in lockstep with it. It is NOT a
# reproduction-length record: disc-core's own active-byte retirement countdown
# (a pre-existing gap, not this bead's) diverges early, so these numbers are
# small on purpose and gate the trace's OWN recorded columns, not a long clean
# replay. 21 bare, 222 with --skip-waived.
HANDOVER = "tests/fixtures/handover.ndjson"
HANDOVER_MIN_AGREE = "21"
HANDOVER_SKIP_MIN_AGREE = "222"

# The fifth fixture, minted in Part 12 (tests/fixtures/bonus.provenance.md):
# the first trace in which a bonus is ever placed (bit 7 of a tile's hp word)
# AND picked up -- bonus_6d9a is 0 on every row of every fixture before this
# one. 152 ticks, idle, cross-validated against a same-session Hatari
# reference for 147 of them (oracle frames 5-151; the placement and pickup
# both sit inside that window).
#
# --skip-waived (players[1].* resynced, discr-b6x): 150 -- disc-core has no
# model at all yet for bit 7, $9aa2 or $6e3a/$6d9a, so it diverges the moment
# the pickup strips bit 7 (132 -> 4 on the ST; disc-core's plain damage
# subtraction gives 132 -> 129, oblivious to the flag). This is the gap
# discr-ovl.4/z8m exist to close, not a bug to fix by raising the number.
#
# Full (nothing waived): 22 -- player 2's AI enters one of its 28 unhandled
# $c6ec states, the same pre-existing discr-b6x limitation golden.ndjson and
# tile_damage.ndjson already waive around. Not new.
BONUS = "tests/fixtures/bonus.ndjson"
BONUS_MIN_AGREE = "150"
BONUS_FULL_MIN_AGREE = "22"

# The sixth fixture, minted in Part 12 (tests/fixtures/farbank.provenance.md):
# discr-ovl.3's own capture, confirming the far bank ($7596, tiles_far) is
# read correctly and compares clean against a live trace -- the first fixture
# to exercise `tiles_far[n].*` as compared rows rather than left at their
# frame-0 seed with nothing checking them.
#
# 34 ticks, both bare and --skip-waived (this run's player 2 rows happen not
# to diverge before it either): a bonus pickup at frame 35 flips bit 7 on
# BOTH banks' cell 7 in lockstep (the far bank's own bonus placer, `$9b32`,
# writes the same slot as the near bank's `$9b28` -- docs/disc-notes.md,
# "$9b28.../$9b32..."), and disc-core has no model for bit 7 on EITHER bank
# (discr-dc0/ovl.4's gap), so it diverges there -- reported via the
# pre-existing `tiles[7].hp` row since schema order checks the near bank
# first, not because `tiles_far` disagreed any earlier.
#
# What this fixture does NOT reach: a genuine far-wall DAMAGE hit (`$a5d6`'s
# arm, gated on a disc already owned by real player 1 crossing $7596's wall a
# SECOND time). Attempted and not cheap -- see farbank.provenance.md for the
# recipe and what was tried; `disc::step`'s far-wall branch is modelled from
# the disassembly regardless (mirrors discr-ovl.1's player-1 racket path:
# code-correct, fixture-unexercised).
FARBANK = "tests/fixtures/farbank.ndjson"
FARBANK_MIN_AGREE = "34"

# The seventh fixture, minted in Part 12 (tests/fixtures/bonus_code1.
# provenance.md): the first with the shared $6c5d PRNG stream columns
# (rng_6c5d, latch_id/latch_prio, gate_6e3c/mint_6e3a/code_6d9e/code_6d9c --
# reports/part12-walls.md), and the first to catch bonus code 1 (the disc's
# damage applied twice, $a314/$a31c) live -- three prior phases (bonus,
# multiplier, this one) left that half of discr-z8m unexercised.
#
# 1100 frames, scripted (a rally, not idle -- code 1 needs ~130 gate-fires
# for reasonable odds, which this project's own challenge rounds do not
# stay live long enough to give while idle). Informational numbers only,
# NOT wired into core-check's fixed ten-invocation gate list -- this
# fixture's job is crates/disc-core/src/ai.rs's rng_verify test and
# tile.rs's tile_bonus_code1 test, both of which DO gate `cargo test`.
#
# --skip-waived: 27 -- players[0].anim_cursor, a pre-existing animation-table
# gap this fixture's own input shape reaches earlier than any other fixture
# does, not a regression.
# Full: 17 -- player 2's own unhandled $c6ec states, the same discr-b6x
# limitation every other fixture already waives around.
BONUS_CODE1 = "tests/fixtures/bonus_code1.ndjson"
BONUS_CODE1_MIN_AGREE = "27"
BONUS_CODE1_FULL_MIN_AGREE = "17"

# The repository's first three commits predate conventional commits (`bd init`
# is not one of them), so cog is pointed at the range after them rather than
# being told to ignore a rule. Everything since is compliant.
CONVENTIONAL_SINCE = "ec61cbb"

[tasks.build]
description = "Build the workspace: disc-core and disc-tools, debug"
run = "cargo build"

[tasks.build-release]
description = "The same, optimised. Release and debug keep separate artifacts, so the first release build after a run of debug ones rebuilds every dependency"
run = "cargo build --release"

[tasks.app]
description = "Build and run the playable front end. NEEDS libGL/libX11/libasound"
run = "cargo run --release -p disc-app"

# disc-app is outside default-members so that a missing libGL can never break
# core-check, and the cost of that is exactly what happened: it compiled against
# no gate for a whole phase and rotted through every field disc-core gained --
# Input::fire_held, DiscSlot::active going bool -> u8. This task is the cheap
# half of the trade: run it after changing a disc-core type, and keep it out of
# core-check so a headless box can still gate.
[tasks.app-check]
description = "Build, lint and test disc-app -- the crate core-check deliberately does not cover"
run = [
  "cargo clippy -p disc-app --all-targets -- -D warnings",
  "cargo test -p disc-app",
]

[tasks.oracle]
description = "Build disc-oracle (vendored Musashi; see oracle/README.md)"
run = "make -C oracle"
sources = ["oracle/disc-oracle.c", "oracle/musashi/**/*.c", "oracle/musashi/**/*.h"]
outputs = ["oracle/disc-oracle"]

[tasks.oracle-check]
description = "Differential validation of disc-oracle against Hatari, plus determinism"
depends = ["oracle"]
run = "./scripts/oracle_check.sh"

[tasks.core-check]
description = "The phase gate: fmt + clippy + tests + ten tracecheck runs over six fixtures"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --skip-waived --min-agree $TRACE_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE --skip-waived --min-agree $TILE_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --min-agree $FULL_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE --min-agree $TILE_FULL_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $P1_WALK --min-agree $P1_WALK_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $HANDOVER --skip-waived --min-agree $HANDOVER_SKIP_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $HANDOVER --min-agree $HANDOVER_MIN_AGREE",

  "cargo run -q -p disc-tools --bin tracecheck -- $BONUS --skip-waived --min-agree $BONUS_MIN_AGREE",
  "cargo run -q -p disc-tools --bin tracecheck -- $BONUS --min-agree $BONUS_FULL_MIN_AGREE",

  "cargo run -q -p disc-tools --bin tracecheck -- $FARBANK --min-agree $FARBANK_MIN_AGREE",
]

[tasks.tracecheck]
description = "The ungated view: both fixtures without --min-agree, so a divergence exits 1"
run = [
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN --skip-waived",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE --skip-waived",
  "cargo run -q -p disc-tools --bin tracecheck -- $P1_WALK",
  "cargo run -q -p disc-tools --bin tracecheck -- $HANDOVER --skip-waived",

  "cargo run -q -p disc-tools --bin tracecheck -- $BONUS --skip-waived",

  "cargo run -q -p disc-tools --bin tracecheck -- $FARBANK --skip-waived",
]

[tasks.tracecheck-deep]
description = "Both fixtures with nothing waived -- golden is clean; tile_damage stops at the smash"
run = [
  "cargo run -q -p disc-tools --bin tracecheck -- $GOLDEN",
  "cargo run -q -p disc-tools --bin tracecheck -- $TILE_DAMAGE",
]

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt"

[tasks.clean]
description = "Clean the oracle build and the Rust target directory"
run = ["make -C oracle clean", "cargo clean"]

[tasks.check-commits]
description = "Lint commit messages with cocogitto, from the first conventional commit"
run = "cog check $CONVENTIONAL_SINCE..HEAD"

[tasks.changelog]
description = "Preview the changelog cog would generate (does not write)"
run = "cog changelog $CONVENTIONAL_SINCE..HEAD"
